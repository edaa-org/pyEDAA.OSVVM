# Hand-written sample in the format of OSVVM's WriteCovYaml: a model of one dimension, a cross of two dimensions and a
# model of weight 0, as OSVVM's DelayCoverage writes it.
Version: "0.1"
Coverage: 100.00
Settings: 
  WritePassFail: 1
Models: 
  - Name: "BurstLength"
    TestCases: 
      - "TbAxi4_BasicReadWrite"
    Coverage: 100.00
    Settings: 
      CovWeight: 1
      Goal: 100.0
      WeightMode: "AT_LEAST"
      Seeds: [1, 2]
      CountMode: "COUNT_FIRST"
      IllegalMode: "ILLEGAL_ON"
      Threshold: 45.0
      ThresholdEnable: "FALSE"
      IsRequirement: "FALSE"
      TotalCovCount: 3
      TotalCovGoal: 3
    BinInfo: 
      Dimensions: 1
      FieldNames: 
        - "Length"
      NumBins: 4
    Bins: 
      - Name: "Single"
        Type: "COUNT"
        Range: 
          - {Min: 1, Max: 1}
        Count: 4
        AtLeast: 1
        PercentCov: 100.0000
      - Name: ""
        Type: "COUNT"
        Range: 
          - {Min: 2, Max: 8}
        Count: 2
        AtLeast: 2
        PercentCov: 100.0000
      - Name: "TooLong"
        Type: "ILLEGAL"
        Range: 
          - {Min: 9, Max: 2147483647}
        Count: 0
        AtLeast: 0
        PercentCov: 0.0000
      - Name: "Other"
        Type: "IGNORE"
        Range: 
          - {Min: -2147483648, Max: 0}
        Count: 1
        AtLeast: 0
        PercentCov: 0.0000

  - Name: "AddressCross"
    TestCases: 
      - "TbAxi4_BasicReadWrite"
    Coverage: 100.00
    Settings: 
      CovWeight: 1
      Goal: 100.0
      WeightMode: "AT_LEAST"
      Seeds: [3, 4]
      CountMode: "COUNT_FIRST"
      IllegalMode: "ILLEGAL_ON"
      Threshold: 45.0
      ThresholdEnable: "FALSE"
      IsRequirement: "FALSE"
      TotalCovCount: 2
      TotalCovGoal: 2
    BinInfo: 
      Dimensions: 2
      FieldNames: 
        - "Address"
        - "Burst"
      NumBins: 2
    Bins: 
      - Name: ""
        Type: "COUNT"
        Range: 
          - {Min: 0, Max: 255}
          - {Min: 0, Max: 0}
        Count: 3
        AtLeast: 1
        PercentCov: 100.0000
      - Name: ""
        Type: "COUNT"
        Range: 
          - {Min: 256, Max: 511}
          - {Min: 1, Max: 1}
        Count: 1
        AtLeast: 1
        PercentCov: 100.0000

  - Name: "WriteAddrDelayCov BurstLength"
    TestCases: 
      - "TbAxi4_BasicReadWrite"
    Coverage: 0.00
    Settings: 
      CovWeight: 0
      Goal: 100.0
      WeightMode: "REMAIN"
      Seeds: [332594846, 1269021459]
      CountMode: "COUNT_FIRST"
      IllegalMode: "ILLEGAL_ON"
      Threshold: 45.0
      ThresholdEnable: "FALSE"
      IsRequirement: "FALSE"
      TotalCovCount: 0
      TotalCovGoal: 1
    BinInfo: 
      Dimensions: 1
      FieldNames: 
        - "Bin1"
      NumBins: 1
    Bins: 
      - Name: ""
        Type: "COUNT"
        Range: 
          - {Min: 2, Max: 10}
        Count: 0
        AtLeast: 1
        PercentCov: 0.0000
